name: CI

on:
  pull_request:
    branches: [master, develop, next]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26
  PNPM_VERSION: 10.24.0
  RETENTION_DAYS: 30

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test:no-watch

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-reports
          path: |
            lint-report/
            test-report/
          retention-days: ${{ env.RETENTION_DAYS }}

  build:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mock changelog
        run: pnpm run mock:changelog
      - name: Build project
        run: pnpm run build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-report
          path: build-report/
          retention-days: ${{ env.RETENTION_DAYS }}

name: Release

on:
  push:
    branches:
      - master
      - next
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26
  PNPM_VERSION: 10.24.0
  RETENTION_DAYS: 7

jobs:
  release:
    name: Build, Test and Release
    runs-on: ubuntu-latest

    # Required for npm Trusted Publishing (OIDC) and for semantic-release GitHub operations
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linter
        run: pnpm run lint
      - name: Run tests
        run: pnpm run test:no-watch
      - name: Build project
        run: pnpm run build
      - name: Run semantic-release
        run: pnpm run semantic-release --debug
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: release-build/
          retention-days: ${{ env.RETENTION_DAYS }}

  sync-branches:
    name: Sync downstream branches
    needs: release
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin --prune --tags

      # Rebase next onto master so release commits are added on top of the stable release.
      # Rebase (not force-mirror) preserves any commits that landed on next in the meantime.
      # --force-with-lease prevents overwriting remote changes we haven't seen.
      - name: Sync next ← master
        if: github.ref_name == 'master'
        run: |
          git fetch origin master next
          git branch -f next origin/next
          git rebase origin/master next
          git push origin next --force-with-lease

      # Rebase develop onto next so the release commits (version bump, changelog)
      # land back on develop without a merge PR. Same rebase safety as above.
      - name: Sync develop ← next
        if: github.ref_name == 'next'
        run: |
          git fetch origin develop next
          git branch -f develop origin/develop
          git rebase origin/next develop
          git push origin develop --force-with-lease

name: Release

on:
  push:
    branches:
      - master
      - next
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26
  PNPM_VERSION: 10.24.0
  RETENTION_DAYS: 7

jobs:
  release:
    name: Build, Test and Release
    runs-on: ubuntu-latest

    # Required for npm Trusted Publishing (OIDC) and for semantic-release GitHub operations
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linter
        run: pnpm run lint
      - name: Run tests
        run: pnpm run test:no-watch
      - name: Build project
        run: pnpm run build
      - name: Run semantic-release
        run: pnpm run semantic-release --debug
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: release-build/
          retention-days: ${{ env.RETENTION_DAYS }}

  sync-branches:
    name: Sync downstream branches
    needs: release
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin --prune --tags

      - name: Sync next ← master
        if: github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          gh pr create --base next --head master --title "chore: sync next with master" --body "Automated post-release sync." 2>/dev/null || true
          gh pr merge master --auto --merge --subject "chore: sync next with master" || true

      - name: Sync develop ← next
        if: github.ref_name == 'next'
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          gh pr create --base develop --head next --title "chore: sync develop with next" --body "Automated post-release sync." 2>/dev/null || true
          gh pr merge next --auto --merge --subject "chore: sync develop with next" || true
